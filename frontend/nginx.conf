server {
  listen 80;
  server_tokens off;
  # Pre-staging S4: student / staff / financial-history imports accept up to 10 MiB (MAX_IMPORT_BYTES); the
  # API enforces its own, stricter limits. nginx's 1 MB default refused larger Excel files before the API.
  client_max_body_size 11m;
  root /usr/share/nginx/html;
  index index.html;

  # Security headers for the web application (the API sets its own). Everything is served from this origin:
  # no external script, style, font or image. Inline styles are allowed (critical boot CSS, React style props);
  # scripts are not. HSTS is added by the TLS terminator in front (public HTTPS: BLOCKED_EXTERNAL until deployed).
  # connect-src: Firebase Messaging needs exactly two Google endpoints to obtain the push token (installations, FCM registrations).
  add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; font-src 'self' data:; connect-src 'self' https://firebaseinstallations.googleapis.com https://fcmregistrations.googleapis.com; worker-src 'self'; manifest-src 'self'; object-src 'none'; base-uri 'self'; frame-ancestors 'none'; form-action 'self'" always;
  add_header X-Content-Type-Options "nosniff" always;
  add_header X-Frame-Options "DENY" always;
  add_header Referrer-Policy "strict-origin-when-cross-origin" always;
  add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=()" always;
  add_header Cross-Origin-Opener-Policy "same-origin" always;

  # Same-origin API in deployed Docker/VPS mode. Vite no longer needs a baked-in VPS URL.
  # Pre-staging S5: server-sent events (notifications, platform inbox) are streamed unbuffered and kept open.
  location ~ ^/api/v1/(notifications|platform/inbox)/stream$ {
    proxy_pass http://backend:8000;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header Connection "";
    proxy_buffering off;
    proxy_cache off;
    proxy_read_timeout 1h;
  }

  location /api/ {
    proxy_pass http://backend:8000;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_read_timeout 60s;
  }

  location /health-api {
    proxy_pass http://backend:8000/health;
    proxy_set_header Host $host;
  }

  # Hashed build assets never change: cache them for a year. The HTML shell, the service worker and the
  # manifest must always be revalidated so an update reaches every device.
  location /assets/ {
    add_header Cache-Control "public, max-age=31536000, immutable" always;
    add_header X-Content-Type-Options "nosniff" always;
    try_files $uri =404;
  }
  # Build identity polled by open tabs to announce a new version: never cached anywhere.
  location = /version.json {
    add_header Cache-Control "no-store" always;
    add_header X-Content-Type-Options "nosniff" always;
    try_files $uri =404;
  }
  location = /sw.js {
    add_header Cache-Control "no-cache" always;
    add_header X-Content-Type-Options "nosniff" always;
    try_files $uri =404;
  }

  location / {
    add_header Cache-Control "no-cache" always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; font-src 'self' data:; connect-src 'self' https://firebaseinstallations.googleapis.com https://fcmregistrations.googleapis.com; worker-src 'self'; manifest-src 'self'; object-src 'none'; base-uri 'self'; frame-ancestors 'none'; form-action 'self'" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=()" always;
    add_header Cross-Origin-Opener-Policy "same-origin" always;
    try_files $uri $uri/ /index.html;
  }
}
