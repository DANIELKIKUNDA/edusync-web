<!doctype html>
<html lang="fr">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1.0,viewport-fit=cover"/>
<meta name="theme-color" content="#071a35"/>
<meta name="color-scheme" content="light"/>
<meta name="description" content="EduSync — gestion scolaire professionnelle"/>
<link rel="manifest" href="/manifest.webmanifest"/>
<link rel="icon" href="/icons/favicon.ico" sizes="any"/>
<link rel="icon" href="/icons/edusync-mark.svg" type="image/svg+xml"/>
<link rel="icon" href="/icons/favicon-32.png" type="image/png" sizes="32x32"/>
<link rel="apple-touch-icon" href="/icons/apple-touch-icon.png"/>
<link rel="preload" href="/icons/edusync-mark.svg" as="image" type="image/svg+xml"/>
<title>EduSync</title>
<!-- Boot screen styles are inline so the screen is styled before any script or stylesheet loads. -->
<style>
html,body{margin:0;background:#071a35}
.staticBoot{position:fixed;inset:0;z-index:99999;display:flex;flex-direction:column;align-items:center;justify-content:center;
  color:#fff;font-family:Inter,"Segoe UI",system-ui,-apple-system,sans-serif;transition:opacity .28s ease;
  background:radial-gradient(60vmax 60vmax at 50% 42%,rgba(37,140,255,.20),transparent 62%),linear-gradient(160deg,#061430 0%,#0a2350 100%)}
.staticBoot.out{opacity:0;pointer-events:none}
.staticBootCore{display:flex;flex-direction:column;align-items:center;gap:20px;animation:bootIn .5s cubic-bezier(.2,.7,.2,1) both}
.staticBootMark{width:88px;height:88px;border-radius:22px;box-shadow:0 18px 50px rgba(0,0,0,.35),0 0 0 1px rgba(255,255,255,.06);animation:bootPulse 2.4s ease-in-out infinite}
.staticBootName{font-size:26px;font-weight:700;letter-spacing:-.6px;line-height:1}
.staticBootLine{width:148px;height:3px;border-radius:9px;background:rgba(255,255,255,.14);overflow:hidden}
.staticBootLine i{display:block;width:40%;height:100%;border-radius:9px;background:linear-gradient(90deg,#25b9ff,#5d8bff);animation:bootSweep 1.1s cubic-bezier(.45,0,.2,1) infinite}
.staticBootSign{position:absolute;bottom:max(28px,env(safe-area-inset-bottom));font-size:12.5px;font-weight:600;letter-spacing:.4px;color:rgba(255,255,255,.62)}
@keyframes bootSweep{from{transform:translateX(-100%)}to{transform:translateX(250%)}}
@keyframes bootIn{from{opacity:0;transform:scale(.96)}to{opacity:1;transform:none}}
@keyframes bootPulse{50%{transform:scale(1.035)}}
@media (max-height:420px){.staticBootMark{width:64px;height:64px;border-radius:16px}.staticBootCore{gap:14px}.staticBootSign{bottom:12px}}
@media (prefers-reduced-motion:reduce){.staticBootCore,.staticBootMark{animation:none}.staticBootLine i{animation:none;width:100%;opacity:.7}}
</style>
</head>
<body>
<div id="edusync-boot" class="staticBoot" role="status" aria-label="Chargement d’EduSync">
  <div class="staticBootCore"><img class="staticBootMark" src="/icons/edusync-mark.svg" alt="" width="88" height="88"/><span class="staticBootName">EduSync</span><div class="staticBootLine"><i></i></div></div>
  <div class="staticBootSign">from VolcanoTech</div>
</div>
<div id="root"></div>
<script type="module" src="/src/main.tsx"></script>
</body>
</html>
