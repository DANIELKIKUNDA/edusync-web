# EduSync — déploiement STAGING uniquement, modèle à moindre privilège (CICD.md). Jamais de production.
# Déclenché quand la CI d'un push de main (ou d'un tag edusync-*) réussit, ou à la main pour un SHA déjà construit.
# La seule action distante est la commande forcée du compte `deploy` :   deploy <SHA complet>
# Aucun script transféré, aucun SCP / SFTP, aucun accès Docker du compte `deploy` : sur le serveur, la commande forcée
# (root-owned) valide la requête puis appelle, via une unique règle sudo sans argument, le contrôleur root installé
# administrativement. Le contrôleur revérifie tout (CI réussie, images autorisées par digest, arm64), sauvegarde,
# migre, teste, puis conserve la version, revient automatiquement en arrière ou s'arrête de façon sûre.
# Le GITHUB_TOKEN éphémère du run (lecture du résultat de CI et des images) passe sur l'entrée standard SSH.
name: Deploy staging

on:
  workflow_run:
    workflows: [CI]
    types: [completed]
  workflow_dispatch:
    inputs:
      sha:
        description: "SHA complet (40 caractères) déjà construit par une CI réussie"
        required: true

permissions:
  contents: read
  actions: read
  packages: read

concurrency:
  group: deploy-staging
  cancel-in-progress: false

jobs:
  deploy:
    name: Staging — deploy <SHA> (commande forcée)
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.event == 'push' &&
       (github.event.workflow_run.head_branch == 'main' || startsWith(github.event.workflow_run.head_branch, 'edusync-')))
    runs-on: ubuntu-24.04
    environment: staging
    env:
      SHA: ${{ github.event_name == 'workflow_dispatch' && inputs.sha || github.event.workflow_run.head_sha }}
    steps:
      - name: Staging configuré ?
        id: cfg
        env:
          HOST: ${{ secrets.STAGING_SSH_HOST }}
          KEY: ${{ secrets.STAGING_SSH_KEY }}
          KNOWN: ${{ secrets.STAGING_SSH_KNOWN_HOSTS }}
          USER_: ${{ secrets.STAGING_SSH_USER }}
        run: |
          if [[ -z "$HOST" || -z "$KEY" || -z "$KNOWN" || -z "$USER_" ]]; then
            echo "configured=false" >> "$GITHUB_OUTPUT"
            echo "::notice::Staging non configuré (secrets STAGING_SSH_* absents) : aucun déploiement."
            echo "### Staging non configuré — aucun déploiement (secrets STAGING_SSH_* absents)" >> "$GITHUB_STEP_SUMMARY"
          else
            echo "configured=true" >> "$GITHUB_OUTPUT"
          fi
      - name: SHA valide (40 caractères hexadécimaux minuscules)
        if: steps.cfg.outputs.configured == 'true'
        run: '[[ "$SHA" =~ ^[0-9a-f]{40}$ ]] || { echo "SHA invalide"; exit 1; }'
      - name: Clé SSH de déploiement (jamais affichée)
        if: steps.cfg.outputs.configured == 'true'
        env:
          KEY: ${{ secrets.STAGING_SSH_KEY }}
          KNOWN: ${{ secrets.STAGING_SSH_KNOWN_HOSTS }}
        run: |
          install -m 700 -d ~/.ssh
          printf '%s\n' "$KEY" > ~/.ssh/staging_key && chmod 600 ~/.ssh/staging_key
          printf '%s\n' "$KNOWN" > ~/.ssh/known_hosts && chmod 644 ~/.ssh/known_hosts
      - name: deploy <SHA>
        if: steps.cfg.outputs.configured == 'true'
        env:
          HOST: ${{ secrets.STAGING_SSH_HOST }}
          USER_: ${{ secrets.STAGING_SSH_USER }}
          PORT: ${{ vars.STAGING_SSH_PORT || '22' }}
          RUN_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set +e
          printf '%s\n' "$RUN_TOKEN" | ssh -i ~/.ssh/staging_key -p "$PORT" -T \
            -o StrictHostKeyChecking=yes -o BatchMode=yes -o IdentitiesOnly=yes -o ClearAllForwardings=yes \
            "$USER_@$HOST" "deploy $SHA"
          code=$?
          set -e
          case $code in
            0)  msg="déployé et vérifié (smoke tests PASS)" ;;
            2)  msg="refusé — rollback automatique vers les digests précédents" ;;
            3)  msg="refusé — arrêt sûr (migration nouvelle), restauration supervisée (CICD.md §6)" ;;
            64) msg="requête refusée par la commande forcée" ;;
            65) msg="vérification refusée (CI, dépôt ou images)" ;;
            70) msg="échec avant tout changement (sauvegarde, registre) — version précédente intacte" ;;
            75) msg="un autre déploiement est en cours" ;;
            78) msg="installation serveur non sûre — réinstallation administrative requise" ;;
            *)  msg="échec SSH ou inattendu (code $code)" ;;
          esac
          echo "### Staging $SHA : $msg" >> "$GITHUB_STEP_SUMMARY"
          exit $code
      - name: Vérification externe (HTTPS public)
        if: steps.cfg.outputs.configured == 'true' && vars.STAGING_PUBLIC_URL != ''
        env:
          URL: ${{ vars.STAGING_PUBLIC_URL }}
        run: |
          for i in $(seq 1 12); do
            code=$(curl -s -o /dev/null -w '%{http_code}' "$URL/health-api" || true)
            [[ "$code" == "200" ]] && { echo "HTTPS public : $URL/health-api → 200"; exit 0; }
            sleep 10
          done
          echo "HTTPS public injoignable ($URL/health-api → $code)"; exit 1
      - name: Nettoyage de la clé
        if: always()
        run: rm -f ~/.ssh/staging_key
