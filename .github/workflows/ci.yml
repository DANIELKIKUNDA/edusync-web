# EduSync — intégration continue (CICD.md).
# Toute branche / PR : tests backend, typecheck + build frontend, sécurité.
# main et tags de certification : en plus, images Docker multi-architecture (linux/amd64 + linux/arm64) publiées sur
# GHCR, étiquetées par le SHA exact du commit (jamais « latest » seul) — le déploiement staging part de ces images.
name: CI

on:
  push:
    branches: [main]
    tags: ["edusync-*", "v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  backend:
    name: Backend — tests et compilation
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: backend/requirements.lock
      - name: Dépendances figées (requirements.lock)
        working-directory: backend
        run: |
          python -m pip install --upgrade pip
          pip install -c requirements.lock .
          # Test tools come from the lock too (pypdf 6.19.0 was re-installed here over the locked 6.21.2: 11 CVE)
          pip install -c requirements.lock pytest pypdf
      - name: Compilation Python
        working-directory: backend
        run: python -m compileall -q src
      - name: Tests backend
        working-directory: backend
        env:
          PYTHONPATH: src
          PYTHONUTF8: "1"
        run: python -m pytest -q -p no:cacheprovider

  rbac-contract:
    name: RBAC — registre canonique, migration additive, droits identiques
    runs-on: ubuntu-24.04
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: edusync_owner
          POSTGRES_PASSWORD: ci-owner-only
          POSTGRES_DB: edusync
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U edusync_owner" --health-interval 5s --health-timeout 5s --health-retries 20
    env:
      PYTHONPATH: src
      PYTHONUTF8: "1"
      EDUSYNC_OWNER_DATABASE_URL: postgresql+psycopg://edusync_owner:ci-owner-only@127.0.0.1:5432/edusync
      EDUSYNC_TENANT_DATABASE_URL: postgresql+psycopg://edusync_tenant:ci-tenant-only@127.0.0.1:5432/edusync
      EDUSYNC_PLATFORM_DATABASE_URL: postgresql+psycopg://edusync_platform:ci-platform-only@127.0.0.1:5432/edusync
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: backend/requirements.lock
      - name: Dépendances figées
        working-directory: backend
        run: |
          python -m pip install --upgrade pip
          pip install -c requirements.lock .
      # Owner decision 12: migrate up to 0084, seed every standard role / scope / clone / exception, snapshot the
      # effective permissions with the previous engine, apply 0085, snapshot with the new engine: must be identical.
      - name: Base jusqu'à 0084 + jeu de rôles
        working-directory: backend
        env:
          EDUSYNC_MIGRATE_UNTIL: 0084_platform_messaging_cockpit
        run: |
          python scripts/provision_database.py
          python ../tools/ci/rbac_seed.py
          python ../tools/ci/rbac_snapshot.py snapshot /tmp/rbac_before.json --legacy
      - name: Migration 0085 puis preuve de non-régression
        working-directory: backend
        # The proof covers the engine change of 0085 only. Later migrations may change standard-role baselines on purpose
        # (owner decisions, e.g. 0090 CAISSIER ⊇ SECRÉTARIAT): they are checked against the canonical registry below.
        env:
          EDUSYNC_MIGRATE_UNTIL: 0085_school_rbac_policies
        run: |
          python scripts/provision_database.py
          python ../tools/ci/rbac_snapshot.py snapshot /tmp/rbac_after.json
          python ../tools/ci/rbac_snapshot.py compare /tmp/rbac_before.json /tmp/rbac_after.json
      - name: Migrations suivantes (décisions du propriétaire sur les rôles)
        working-directory: backend
        run: python scripts/provision_database.py
      - name: Aucune dérive base ↔ registre canonique
        working-directory: backend
        run: python ../tools/ci/rbac_registry.py check
      - name: Caissier — PostgreSQL réel, reçus et rapports archivés
        working-directory: backend
        env:
          CI: "true"
        run: python ../tools/ci/cashier_postgres_integration.py

  frontend:
    name: Frontend — typecheck et build
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Dépendances figées (npm ci)
        working-directory: frontend
        run: npm ci
      - name: Typecheck
        working-directory: frontend
        run: npx tsc --noEmit -p tsconfig.json
      - name: Régressions plateforme (MFA, push, réseau, navigation)
        working-directory: frontend
        run: npm test
      - name: Navigateur de certification
        working-directory: frontend
        run: npx playwright install --with-deps chromium
      - name: Parcours plateforme dans Chromium (réponses serveur de test)
        working-directory: frontend
        run: npm run test:browser
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: platform-browser-components
          path: frontend/test-results/
      - name: Build
        working-directory: frontend
        run: npx vite build
      - name: Build compilé — premier démarrage, cache et révocation
        working-directory: frontend
        env:
          EDUSYNC_TEST_BUILD: "1"
        run: npm run test:browser -- platform.spec.ts offline.spec.ts school_offline.spec.ts
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: platform-browser-compiled
          path: frontend/test-results/

  security:
    name: Sécurité — dépendances, licences, secrets
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: backend/requirements.lock
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Vulnérabilités Python (pip-audit sur requirements.lock)
        run: |
          pip install pip-audit==2.10.1
          pip-audit -r backend/requirements.lock --progress-spinner off
      - name: Vulnérabilités npm (exécution)
        working-directory: frontend
        run: |
          npm ci --ignore-scripts
          npm audit --omit=dev
      - name: Licences et SBOM
        run: |
          pip install -c backend/requirements.lock ./backend
          python tools/certification/supply_chain.py
      - name: Secrets (formats sans ambiguïté)
        run: python tools/ci/secret_patterns.py

  cd-privileged:
    name: CD privilégiée — installation Linux réelle (sshd, sudo, shebang, refus, verrou)
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - name: Harnais Linux jetable (tools/ci/cd_linux/privileged_checks.sh)
        run: bash tools/ci/cd_linux/privileged_checks.sh

  images:
    name: Images Docker (amd64 + arm64) → GHCR
    needs: [backend, rbac-contract, frontend, security]
    if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/'))
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Noms d'images (minuscules) et étiquettes
        id: tags
        run: |
          owner=$(echo "${{ github.repository_owner }}" | tr '[:upper:]' '[:lower:]')
          echo "registry=ghcr.io/${owner}" >> "$GITHUB_OUTPUT"
          extra=""
          if [[ "${GITHUB_REF}" == refs/tags/* ]]; then extra="${GITHUB_REF#refs/tags/}"; fi
          echo "extra=${extra}" >> "$GITHUB_OUTPUT"
      - name: Image backend (API, migrateur, workers)
        uses: docker/build-push-action@v6
        with:
          context: backend
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            ${{ steps.tags.outputs.registry }}/edusync-backend:${{ github.sha }}
            ${{ steps.tags.outputs.extra && format('{0}/edusync-backend:{1}', steps.tags.outputs.registry, steps.tags.outputs.extra) || '' }}
          labels: org.opencontainers.image.revision=${{ github.sha }}
          cache-from: type=gha,scope=backend
          cache-to: type=gha,mode=max,scope=backend
      - name: Image frontend (PWA + nginx)
        uses: docker/build-push-action@v6
        with:
          context: frontend
          platforms: linux/amd64,linux/arm64
          build-args: EDUSYNC_BUILD_ID=${{ github.sha }}
          push: true
          tags: |
            ${{ steps.tags.outputs.registry }}/edusync-frontend:${{ github.sha }}
            ${{ steps.tags.outputs.extra && format('{0}/edusync-frontend:{1}', steps.tags.outputs.registry, steps.tags.outputs.extra) || '' }}
          labels: org.opencontainers.image.revision=${{ github.sha }}
          cache-from: type=gha,scope=frontend
          cache-to: type=gha,mode=max,scope=frontend
      - name: Image sauvegarde
        uses: docker/build-push-action@v6
        with:
          context: deploy/backup
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            ${{ steps.tags.outputs.registry }}/edusync-backup:${{ github.sha }}
            ${{ steps.tags.outputs.extra && format('{0}/edusync-backup:{1}', steps.tags.outputs.registry, steps.tags.outputs.extra) || '' }}
          labels: org.opencontainers.image.revision=${{ github.sha }}
          cache-from: type=gha,scope=backup
          cache-to: type=gha,mode=max,scope=backup
