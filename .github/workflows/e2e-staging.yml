# EduSync — parcours de bout en bout contre STAGING après chaque déploiement réussi (lot 2026-10).
# Lecture seule, compte plateforme de test dédié (jamais un Manager). Sans les secrets E2E_PLATFORM_*,
# le contrôle de certification échoue (docs/architecture/RUNBOOK_INCIDENT.md §6).
# Un échec rend le run rouge : la version déployée ne doit pas être promue (procédure production, PRODUCTION.md).
name: E2E staging

on:
  workflow_run:
    workflows: [Deploy staging]
    types: [completed]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: e2e-staging
  cancel-in-progress: false

jobs:
  e2e:
    name: Certification authentifiée plateforme et école
    if: >-
      (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main') ||
      (github.event_name == 'workflow_run' && github.event.workflow_run.conclusion == 'success' &&
       github.event.workflow_run.head_branch == 'main' &&
       github.event.workflow_run.head_repository.full_name == github.repository)
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    environment: staging
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'workflow_run' && github.event.workflow_run.head_sha || github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Vérifier la provenance du SHA avant de charger les secrets
        env:
          SHA: ${{ github.event.workflow_run.head_sha || github.sha }}
        run: |
          [[ "$(git rev-parse HEAD)" == "$SHA" ]]
          git merge-base --is-ancestor "$SHA" refs/remotes/origin/main
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
      - name: Parcours plateforme authentifié du SHA staging
        env:
          E2E_BASE_URL: https://staging.myeducsync.com
          E2E_EXPECTED_SHA: ${{ github.event.workflow_run.head_sha || github.sha }}
          E2E_PLATFORM_EMAIL: ${{ secrets.E2E_PLATFORM_EMAIL }}
          E2E_PLATFORM_PASSWORD: ${{ secrets.E2E_PLATFORM_PASSWORD }}
          E2E_PLATFORM_TOTP_SECRET: ${{ secrets.E2E_PLATFORM_TOTP_SECRET }}
        run: python tools/ci/e2e_staging.py
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
      - name: Préparer Chromium
        working-directory: frontend
        run: |
          npm ci
          npx playwright install --with-deps chromium
      - name: Parcours école authentifié du SHA staging dans Chromium
        working-directory: frontend
        env:
          E2E_EXPECTED_SHA: ${{ github.event.workflow_run.head_sha || github.sha }}
          E2E_SCHOOL_EMAIL: ${{ secrets.E2E_SCHOOL_EMAIL }}
          E2E_SCHOOL_PASSWORD: ${{ secrets.E2E_SCHOOL_PASSWORD }}
        run: node browser-tests/live-staging.mjs
