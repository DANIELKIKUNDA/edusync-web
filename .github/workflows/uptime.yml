name: PR41 queue cancellation probe
on:
  workflow_dispatch:
    inputs:
      hold_seconds:
        type: choice
        options: ['90', '0']
        default: '90'
permissions: {}
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true
jobs:
  probe:
    runs-on: [self-hosted, linux, x64, volcano-ci]
    timeout-minutes: 3
    steps:
      - name: Controlled cancellation probe
        env:
          HOLD_SECONDS: ${{ inputs.hold_seconds }}
        run: |
          set -euo pipefail
          case "$HOLD_SECONDS" in 0|90) ;; *) exit 2 ;; esac
          echo "Controlled queue probe started"
          sleep "$HOLD_SECONDS"
          echo "Controlled queue probe completed"