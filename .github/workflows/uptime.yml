name: Volcano runner smoke
run-name: Volcano runner smoke on WSL 2
on:
  workflow_dispatch:
permissions: {}
jobs:
  smoke:
    name: Linux x64 WSL and Docker
    runs-on: [self-hosted, Linux, X64, volcano-ci]
    timeout-minutes: 2
    steps:
      - name: Verify local runner
        shell: bash
        run: |
          set -euo pipefail
          test "$(uname -s)" = Linux
          test "$(uname -m)" = x86_64
          grep -qi microsoft /proc/sys/kernel/osrelease
          server="$(timeout 20s docker version --format '{{.Server.Os}} {{.Server.Arch}}')"
          test "$server" = 'linux amd64'
          printf 'Linux x64 / WSL 2 / Docker %s\n' "$server"