# EduSync — certification Linux réelle de la CD staging (CICD.md §9). Runner JETABLE uniquement, jamais le VPS.
# Après une CI réussie sur main (ou un tag edusync-*) : installation administrative réelle, puis scénarios de bout en
# bout via le vrai sshd → commande forcée → sudo → contrôleur installé → API GitHub → GHCR → Docker, avec les images
# réelles de ce commit et du précédent commit certifié ayant les mêmes migrations : hôte vierge, port occupé, rollback
# réussi, sauvegarde indisponible, registre absent / illisible / divergent, rollback en échec, reprise.
name: CD certification

on:
  workflow_run:
    workflows: [CI]
    types: [completed]
  workflow_dispatch:
    inputs:
      sha:
        description: "SHA complet (40 caractères) déjà construit par une CI réussie sur main"
        required: true

permissions:
  contents: read
  actions: read
  packages: read

concurrency:
  group: cd-certification
  cancel-in-progress: false

jobs:
  stack:
    name: Scénarios de bout en bout (hôte Linux jetable)
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.event == 'push' &&
       (github.event.workflow_run.head_branch == 'main' || startsWith(github.event.workflow_run.head_branch, 'edusync-')))
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    env:
      CUR_SHA: ${{ github.event_name == 'workflow_dispatch' && inputs.sha || github.event.workflow_run.head_sha }}
    steps:
      - name: SHA valide
        run: '[[ "$CUR_SHA" =~ ^[0-9a-f]{40}$ ]] || { echo "SHA invalide"; exit 1; }'
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.CUR_SHA }}
          fetch-depth: 0
      - name: Version précédente certifiée (migrations incluses dans les nôtres, images sur GHCR)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          for c in $(gh api "repos/${{ github.repository }}/actions/workflows/ci.yml/runs?branch=main&event=push&status=success&per_page=50" \
                       --jq '.workflow_runs[].head_sha' | awk '!seen[$0]++'); do
            [[ "$c" == "$CUR_SHA" ]] && continue
            git cat-file -e "$c^{commit}" 2>/dev/null || continue
            # Rollback target: its migrations must be a subset of ours (only additions since, nothing modified/removed).
            if git diff --quiet --diff-filter=DMR "$c" "$CUR_SHA" -- backend/migrations; then
              echo "PREV_SHA=$c" >> "$GITHUB_ENV"; echo "Version précédente : $c"; exit 0
            fi
          done
          echo "Aucune version précédente certifiée compatible (migrations modifiées ou supprimées)"; exit 1
      - name: Scénarios (tools/ci/cd_linux/stack_scenarios.sh)
        env:
          RUN_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: bash tools/ci/cd_linux/stack_scenarios.sh
