[build-system]
requires = ["setuptools>=75", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "edusync-web-backend"
version = "1.0.0rc1"
description = "EduSync Web backend (FastAPI, PostgreSQL RLS, multi-school SaaS)"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.128",
  "uvicorn[standard]>=0.30",
  "sqlalchemy>=2.0",
  "psycopg[binary]>=3.2",
  "pydantic>=2.10",
  "pydantic-settings>=2.7",
  "PyJWT>=2.15",
  "argon2-cffi>=23.1",
  "redis>=5.2",
  "structlog>=25.1",
  "httpx>=0.28",
  "reportlab>=4.2",
  "openpyxl>=3.1",
  "XlsxWriter>=3.2",
  # Second factor of platform accounts (option B): AES-256-GCM at rest, local QR code (no external service).
  "cryptography>=46",
  "segno>=1.6",
  # External messaging (2026-10): SMTP transactional e-mail and Firebase Cloud Messaging (push), behind provider ports.
  "aiosmtplib>=5.1",
  "firebase-admin>=7.7",
]

[project.optional-dependencies]
test = ["pytest>=8", "httpx>=0.28", "pypdf>=5"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
