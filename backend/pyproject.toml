[build-system]
requires = ["setuptools>=75", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "edusync-web-backend"
version = "0.52.0"
description = "EduSync Web backend (FastAPI, PostgreSQL RLS, multi-school SaaS)"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.128",
  "uvicorn[standard]>=0.30",
  "sqlalchemy>=2.0",
  "psycopg[binary]>=3.2",
  "pydantic>=2.10",
  "pydantic-settings>=2.7",
  "PyJWT>=2.15",
  "argon2-cffi>=23.1",
  "redis>=5.2",
  "structlog>=25.1",
  "httpx>=0.28",
  "reportlab>=4.2",
  "openpyxl>=3.1",
  "XlsxWriter>=3.2",
]

[project.optional-dependencies]
test = ["pytest>=8", "httpx>=0.28", "pypdf>=5"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
