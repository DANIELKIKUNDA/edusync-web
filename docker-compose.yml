services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-edusync}
      POSTGRES_USER: ${POSTGRES_OWNER_USER:-edusync_owner}
      POSTGRES_PASSWORD: ${POSTGRES_OWNER_PASSWORD:?POSTGRES_OWNER_PASSWORD required}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_OWNER_USER:-edusync_owner} -d ${POSTGRES_DB:-edusync}"]
      interval: 5s
      timeout: 5s
      retries: 20
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    # noeviction: queued messages (outbox, notifications) are never silently dropped when memory is full.
    command: ["redis-server", "--appendonly", "yes", "--maxmemory-policy", "noeviction"]
    volumes:
      - redis_data:/data
    restart: unless-stopped

  # One-shot privileged service. The owner/admin bootstrap secrets never enter the API container.
  migrator:
    build: ./backend
    env_file: ${EDUSYNC_ENV_FILE:-.env}
    depends_on:
      postgres:
        condition: service_healthy
    command: ["sh", "-c", "python scripts/provision_database.py && python scripts/bootstrap_platform_admin.py"]
    restart: "no"

  backend:
    build: ./backend
    environment:
      EDUSYNC_ENV: ${EDUSYNC_ENV:-dev}
      EDUSYNC_TENANT_DATABASE_URL: ${EDUSYNC_TENANT_DATABASE_URL:?EDUSYNC_TENANT_DATABASE_URL required}
      EDUSYNC_PLATFORM_DATABASE_URL: ${EDUSYNC_PLATFORM_DATABASE_URL:?EDUSYNC_PLATFORM_DATABASE_URL required}
      EDUSYNC_REDIS_URL: ${EDUSYNC_REDIS_URL:-redis://redis:6379/0}
      EDUSYNC_JWT_SECRET: ${EDUSYNC_JWT_SECRET:?EDUSYNC_JWT_SECRET required}
      EDUSYNC_JWT_ISSUER: ${EDUSYNC_JWT_ISSUER:-edusync}
      EDUSYNC_JWT_AUDIENCE: ${EDUSYNC_JWT_AUDIENCE:-edusync-web}
      EDUSYNC_ACCESS_TOKEN_MINUTES: ${EDUSYNC_ACCESS_TOKEN_MINUTES:-30}
      EDUSYNC_OFFLINE_FINANCE_ENABLED: ${EDUSYNC_OFFLINE_FINANCE_ENABLED:-false}
      EDUSYNC_OFFLINE_FINANCE_CERTIFIED: ${EDUSYNC_OFFLINE_FINANCE_CERTIFIED:-false}
      EDUSYNC_CORS_ORIGINS: ${EDUSYNC_CORS_ORIGINS:-http://localhost:5173,http://localhost:8080}
      # Public domain(s) + localhost (the container health check calls http://localhost:8000).
      EDUSYNC_TRUSTED_HOSTS: ${EDUSYNC_TRUSTED_HOSTS:-localhost,127.0.0.1}
      EDUSYNC_MFA_ENCRYPTION_KEY: ${EDUSYNC_MFA_ENCRYPTION_KEY:-}
      EDUSYNC_DOCUMENT_LINK_SECRET: ${EDUSYNC_DOCUMENT_LINK_SECRET:-}
      EDUSYNC_SESSION_ABSOLUTE_DAYS: ${EDUSYNC_SESSION_ABSOLUTE_DAYS:-0}
      EDUSYNC_SESSION_IDLE_DAYS: ${EDUSYNC_SESSION_IDLE_DAYS:-0}
      EDUSYNC_OBJECT_STORAGE_BACKEND: ${EDUSYNC_OBJECT_STORAGE_BACKEND:-s3}
      EDUSYNC_OBJECT_STORAGE_ENDPOINT: ${EDUSYNC_OBJECT_STORAGE_ENDPOINT:-http://object-storage:8333}
      EDUSYNC_OBJECT_STORAGE_ACCESS_KEY: ${EDUSYNC_OBJECT_STORAGE_ACCESS_KEY:?EDUSYNC_OBJECT_STORAGE_ACCESS_KEY required}
      EDUSYNC_OBJECT_STORAGE_SECRET_KEY: ${EDUSYNC_OBJECT_STORAGE_SECRET_KEY:?EDUSYNC_OBJECT_STORAGE_SECRET_KEY required}
      EDUSYNC_OBJECT_STORAGE_BUCKET: ${EDUSYNC_OBJECT_STORAGE_BUCKET:-edusync-documents}
      EDUSYNC_OBJECT_STORAGE_REGION: ${EDUSYNC_OBJECT_STORAGE_REGION:-us-east-1}
      EDUSYNC_OBJECT_STORAGE_PATH_STYLE: ${EDUSYNC_OBJECT_STORAGE_PATH_STYLE:-true}
      EDUSYNC_SETUP_TOKEN: ${EDUSYNC_SETUP_TOKEN:-}
      # Written by the backup service; shown on the platform health screen.
      EDUSYNC_BACKUP_STATUS_FILE: /backup-status/last.json
      # External messaging: the API only needs to know which channels exist (secrets stay with the worker), the public
      # Firebase web configuration, the Orange receipt callback secret and the public address used in e-mailed links.
      EDUSYNC_PUSH_PROVIDER: ${EDUSYNC_PUSH_PROVIDER:-disabled}
      EDUSYNC_SMS_PROVIDER: ${EDUSYNC_SMS_PROVIDER:-disabled}
      EDUSYNC_EMAIL_PROVIDER: ${EDUSYNC_EMAIL_PROVIDER:-disabled}
      EDUSYNC_SMTP_HOST: ${EDUSYNC_SMTP_HOST:-}
      EDUSYNC_SMTP_FROM_EMAIL: ${EDUSYNC_SMTP_FROM_EMAIL:-}
      EDUSYNC_SMTP_SECURITY: ${EDUSYNC_SMTP_SECURITY:-starttls}
      EDUSYNC_ORANGE_SMS_CLIENT_ID: ${EDUSYNC_ORANGE_SMS_CLIENT_ID:-}
      EDUSYNC_ORANGE_SMS_SENDER_ADDRESS: ${EDUSYNC_ORANGE_SMS_SENDER_ADDRESS:-}
      EDUSYNC_ORANGE_SMS_SENDER_NAME: ${EDUSYNC_ORANGE_SMS_SENDER_NAME:-}
      EDUSYNC_ORANGE_SMS_DR_SECRET: ${EDUSYNC_ORANGE_SMS_DR_SECRET:-}
      EDUSYNC_ORANGE_SMS_DR_ALLOWED_IPS: ${EDUSYNC_ORANGE_SMS_DR_ALLOWED_IPS:-}
      EDUSYNC_FCM_WEB_CONFIG_JSON: ${EDUSYNC_FCM_WEB_CONFIG_JSON:-}
      EDUSYNC_FCM_VAPID_PUBLIC_KEY: ${EDUSYNC_FCM_VAPID_PUBLIC_KEY:-}
      EDUSYNC_PUBLIC_APP_URL: ${EDUSYNC_PUBLIC_APP_URL:-http://localhost:8080}
      # Trust X-Forwarded-For only from the reverse proxies (fixed addresses of nginx and of the TLS terminator).
      FORWARDED_ALLOW_IPS: ${EDUSYNC_FORWARDED_ALLOW_IPS:-172.30.57.10,172.30.57.11}
    volumes:
      - backup_status:/backup-status:ro
    depends_on:
      migrator:
        condition: service_completed_successfully
      redis:
        condition: service_started
      object-storage:
        condition: service_started
    # Loopback only: clients reach the API through nginx, so X-Forwarded-For cannot be forged directly.
    ports:
      - "127.0.0.1:8000:8000"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health', timeout=2).read()"]
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped

  # Background workers: dedicated least-privilege PostgreSQL role (edusync_worker), never the owner.
  outbox-worker:
    build: ./backend
    command: ["python", "-m", "edusync.modules.sync.outbox_worker"]
    environment:
      EDUSYNC_ENV: ${EDUSYNC_ENV:-dev}
      EDUSYNC_WORKER_DATABASE_URL: ${EDUSYNC_WORKER_DATABASE_URL:?EDUSYNC_WORKER_DATABASE_URL required}
      EDUSYNC_REDIS_URL: ${EDUSYNC_REDIS_URL:-redis://redis:6379/0}
      EDUSYNC_JWT_SECRET: ${EDUSYNC_JWT_SECRET:?EDUSYNC_JWT_SECRET required}
    depends_on:
      migrator:
        condition: service_completed_successfully
      redis:
        condition: service_started
    restart: unless-stopped

  communications-worker:
    build: ./backend
    command: ["python", "-m", "edusync.modules.communications.worker"]
    environment:
      EDUSYNC_ENV: ${EDUSYNC_ENV:-dev}
      EDUSYNC_WORKER_DATABASE_URL: ${EDUSYNC_WORKER_DATABASE_URL:?EDUSYNC_WORKER_DATABASE_URL required}
      EDUSYNC_REDIS_URL: ${EDUSYNC_REDIS_URL:-redis://redis:6379/0}
      EDUSYNC_JWT_SECRET: ${EDUSYNC_JWT_SECRET:?EDUSYNC_JWT_SECRET required}
      # Decrypts push tokens and one-shot account links at send time (same key as the API, derived per purpose).
      EDUSYNC_MFA_ENCRYPTION_KEY: ${EDUSYNC_MFA_ENCRYPTION_KEY:-}
      EDUSYNC_PUBLIC_APP_URL: ${EDUSYNC_PUBLIC_APP_URL:-http://localhost:8080}
      # Real providers (EXTERNAL_REQUIRED until their secrets are provided and the real probes pass). Disabled channels
      # fail cleanly (PROVIDER_NOT_CONFIGURED), never reported as sent.
      EDUSYNC_SMS_PROVIDER: ${EDUSYNC_SMS_PROVIDER:-disabled}
      EDUSYNC_ORANGE_SMS_CLIENT_ID: ${EDUSYNC_ORANGE_SMS_CLIENT_ID:-}
      EDUSYNC_ORANGE_SMS_CLIENT_SECRET: ${EDUSYNC_ORANGE_SMS_CLIENT_SECRET:-}
      EDUSYNC_ORANGE_SMS_SENDER_ADDRESS: ${EDUSYNC_ORANGE_SMS_SENDER_ADDRESS:-}
      EDUSYNC_ORANGE_SMS_SENDER_NAME: ${EDUSYNC_ORANGE_SMS_SENDER_NAME:-}
      EDUSYNC_EMAIL_PROVIDER: ${EDUSYNC_EMAIL_PROVIDER:-disabled}
      EDUSYNC_SMTP_HOST: ${EDUSYNC_SMTP_HOST:-}
      EDUSYNC_SMTP_PORT: ${EDUSYNC_SMTP_PORT:-587}
      EDUSYNC_SMTP_USERNAME: ${EDUSYNC_SMTP_USERNAME:-}
      EDUSYNC_SMTP_PASSWORD: ${EDUSYNC_SMTP_PASSWORD:-}
      EDUSYNC_SMTP_FROM_EMAIL: ${EDUSYNC_SMTP_FROM_EMAIL:-}
      EDUSYNC_SMTP_FROM_NAME: ${EDUSYNC_SMTP_FROM_NAME:-EduSync}
      EDUSYNC_SMTP_SECURITY: ${EDUSYNC_SMTP_SECURITY:-starttls}
      EDUSYNC_PUSH_PROVIDER: ${EDUSYNC_PUSH_PROVIDER:-disabled}
      # Service account: a mounted secret file (preferred) or the JSON injected by the deployment tool.
      EDUSYNC_FCM_SERVICE_ACCOUNT_FILE: ${EDUSYNC_FCM_SERVICE_ACCOUNT_FILE:-}
      EDUSYNC_FCM_SERVICE_ACCOUNT_JSON: ${EDUSYNC_FCM_SERVICE_ACCOUNT_JSON:-}
    depends_on:
      migrator:
        condition: service_completed_successfully
      redis:
        condition: service_started
    restart: unless-stopped

  frontend:
    build: ./frontend
    depends_on:
      backend:
        condition: service_healthy
    # Loopback only: the public entry point is the TLS terminator (profile "tls").
    ports:
      - "127.0.0.1:8080:80"
    networks:
      default:
        ipv4_address: 172.30.57.10
    restart: unless-stopped

  # Public HTTPS (Let's Encrypt) + HSTS. `docker compose --profile tls up -d` with EDUSYNC_DOMAIN set.
  tls-proxy:
    image: caddy:2.10.2-alpine
    profiles: ["tls"]
    environment:
      EDUSYNC_DOMAIN: ${EDUSYNC_DOMAIN:-}
      EDUSYNC_ACME_EMAIL: ${EDUSYNC_ACME_EMAIL:-}
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./deploy/caddy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - frontend
    networks:
      default:
        ipv4_address: 172.30.57.11
    restart: unless-stopped

  # Private S3-compatible document storage (SeaweedFS). Replace by an external S3 by pointing
  # EDUSYNC_OBJECT_STORAGE_ENDPOINT elsewhere and not starting this service.
  object-storage:
    image: chrislusf/seaweedfs:4.48
    entrypoint: ["/bin/sh", "/deploy/entrypoint.sh"]
    environment:
      S3_ACCESS_KEY: ${EDUSYNC_OBJECT_STORAGE_ACCESS_KEY:?EDUSYNC_OBJECT_STORAGE_ACCESS_KEY required}
      S3_SECRET_KEY: ${EDUSYNC_OBJECT_STORAGE_SECRET_KEY:?EDUSYNC_OBJECT_STORAGE_SECRET_KEY required}
    volumes:
      - ./deploy/seaweedfs/entrypoint.sh:/deploy/entrypoint.sh:ro
      - object_data:/data
    restart: unless-stopped

  # Daily backup (database + documents), restore verified in an isolated database, optional off-site copy.
  backup:
    build: ./deploy/backup
    environment:
      PGHOST: postgres
      PGDATABASE: ${POSTGRES_DB:-edusync}
      PGUSER: ${POSTGRES_OWNER_USER:-edusync_owner}
      PGPASSWORD: ${POSTGRES_OWNER_PASSWORD:?POSTGRES_OWNER_PASSWORD required}
      BACKUP_INTERVAL_SECONDS: ${EDUSYNC_BACKUP_INTERVAL_SECONDS:-86400}
      BACKUP_KEEP_DAYS: ${EDUSYNC_BACKUP_KEEP_DAYS:-14}
      BACKUP_SOURCE_BUCKET: ${EDUSYNC_OBJECT_STORAGE_BUCKET:-edusync-documents}
      RCLONE_CONFIG_SRC_TYPE: s3
      RCLONE_CONFIG_SRC_PROVIDER: Other
      RCLONE_CONFIG_SRC_ENDPOINT: ${EDUSYNC_OBJECT_STORAGE_ENDPOINT:-http://object-storage:8333}
      RCLONE_CONFIG_SRC_ACCESS_KEY_ID: ${EDUSYNC_OBJECT_STORAGE_ACCESS_KEY:?EDUSYNC_OBJECT_STORAGE_ACCESS_KEY required}
      RCLONE_CONFIG_SRC_SECRET_ACCESS_KEY: ${EDUSYNC_OBJECT_STORAGE_SECRET_KEY:?EDUSYNC_OBJECT_STORAGE_SECRET_KEY required}
      # Off-site copy: any rclone remote configured with RCLONE_CONFIG_OFFSITE_* (empty = local backups only).
      BACKUP_OFFSITE: ${EDUSYNC_BACKUP_OFFSITE:-}
      RCLONE_CONFIG_OFFSITE_TYPE: ${EDUSYNC_BACKUP_OFFSITE_TYPE:-s3}
      RCLONE_CONFIG_OFFSITE_PROVIDER: ${EDUSYNC_BACKUP_OFFSITE_PROVIDER:-Other}
      RCLONE_CONFIG_OFFSITE_ENDPOINT: ${EDUSYNC_BACKUP_OFFSITE_ENDPOINT:-}
      RCLONE_CONFIG_OFFSITE_ACCESS_KEY_ID: ${EDUSYNC_BACKUP_OFFSITE_ACCESS_KEY:-}
      RCLONE_CONFIG_OFFSITE_SECRET_ACCESS_KEY: ${EDUSYNC_BACKUP_OFFSITE_SECRET_KEY:-}
    volumes:
      - backups:/backups
      - backup_status:/backup-status
    depends_on:
      migrator:
        condition: service_completed_successfully
      object-storage:
        condition: service_started
    restart: unless-stopped

networks:
  default:
    ipam:
      config:
        - subnet: 172.30.57.0/24

volumes:
  postgres_data:
  redis_data:
  object_data:
  backups:
  backup_status:
  caddy_data:
  caddy_config:
